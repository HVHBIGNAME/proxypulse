name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/... ./cmd/proxypulse
      - run: go test -race ./internal/... ./cmd/proxypulse

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install resource tools
        run: |
          python -m pip install pillow==12.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH 'C:\mingw64\bin'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build portable release
        shell: bash
        run: |
          set -euo pipefail
          version=dev
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python scripts/build_release.py --version "$version"
      - name: Native controls smoke test
        shell: pwsh
        run: |
          $env:PROXYPULSE_GUI_SMOKE = '1'
          go test ./cmd/proxypulse-gui -run TestNativeDesktop -count=1 -timeout 60s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/proxypulse.exe -version
      - uses: actions/upload-artifact@v4
        with:
          name: proxypulse-windows
          path: dist/*
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxypulse-windows
          path: dist
      - name: Create draft release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "ProxyPulse ${RELEASE_TAG#v}" --notes-file CHANGELOG.md
