name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The GUI package imports lxn/walk, which is Windows-only, so vet/test on
    # Linux must target the portable packages only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./internal/... ./cmd/proxypulse
      - run: go test ./internal/...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build CLI
        run: go build -trimpath -ldflags "-s -w" -o proxypulse.exe ./cmd/proxypulse
      - name: Build GUI (manifest + icon via windres)
        shell: bash
        run: |
          set -e
          python -m pip install --quiet pillow
          python scripts/make_icon.py
          (cd assets && windres -i proxypulse.rc -o ../cmd/proxypulse-gui/rsrc.syso --input-format=rc --output-format=coff)
          go build -trimpath -ldflags "-H windowsgui -s -w" -o proxypulse-gui.exe ./cmd/proxypulse-gui
      - uses: actions/upload-artifact@v4
        with:
          name: proxypulse-windows
          path: |
            proxypulse.exe
            proxypulse-gui.exe